# 部门 Agent 模板化示例（商品识别与检索组）。
# 每部门独立 Deployment + HPA，按 QPS 自动伸缩（热门部门 maxReplicas 可到 20）。
apiVersion: v1
kind: Service
metadata:
  name: dept-agent-product
  namespace: shangzhi
spec:
  selector:
    app: dept-agent
    department: product
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dept-agent-product
  namespace: shangzhi
  labels:
    app: dept-agent
    department: product
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dept-agent
      department: product
  template:
    metadata:
      labels:
        app: dept-agent
        department: product
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: department
                      operator: In
                      values: ["jwc"]
                topologyKey: kubernetes.io/hostname
      containers:
        - name: agent
          image: intelligent-customer-service:v0.1.1
          ports:
            - containerPort: 8000
          env:
            - name: DEPT_ID
              value: "dept_product"
            - name: MODEL_NAME
              value: "deepseek-v4-flash"
            - name: STORAGE_MODE
              value: "mongo"
            - name: VECTOR_BACKEND
              value: "mongo"
            - name: DEPT_AGENTS_ENABLED
              value: "false"
            - name: PI_AGENT_ENABLED
              value: "true"
            - name: PI_AGENT_URL
              value: "http://pi-agent:8100"
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: shangzhi-secrets
                  key: DEEPSEEK_API_KEY
            - name: RELAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: shangzhi-secrets
                  key: RELAY_API_KEY
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: shangzhi-secrets
                  key: MONGODB_URI
            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: shangzhi-secrets
                  key: REDIS_ADDR
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: shangzhi-secrets
                  key: INTERNAL_API_TOKEN
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dept-agent-product-hpa
  namespace: shangzhi
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dept-agent-product
  minReplicas: 2
  maxReplicas: 20   # 商品识别与检索组峰值扩容到 20 个 Pod
  metrics:
    - type: Pods
      pods:
        metric:
          name: shangzhi_dept_agent_inflight
        target:
          type: AverageValue
          averageValue: "8"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 3
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
